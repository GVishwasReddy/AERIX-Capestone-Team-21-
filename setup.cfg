# Legacy/compat metadata. Source of truth is pyproject.toml; this file exists so
# that `python setup.py ...` style tooling and older linters keep working.
[metadata]
name = drone_stack
version = 1.0.0
description = ROS-free autonomous drone software stack (MAVLink + RPLIDAR) for Raspberry Pi 5
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
python_requires = >=3.11
include_package_data = True

[options.packages.find]
include = drone_stack*

[flake8]
max-line-length = 100
extend-ignore = E203,W503
