# -----------------------------------------------------------------------------
# §2.6 model interface abstraction. New weights = edit this file, no code
# change (drone_stack/novelty/perception/model_registry.py enforces this -
# if a new .hef ever needs a code change here, that is a bug in the
# abstraction, not in this file). hef_path is repo-root-relative.
#
# terrain: fabseg.hef - a real, retrained multi-class terrain-segmentation
# model (7 classes, channel order confirmed to match TerrainClass's own
# declared enum order exactly - grass, pavement, dirt, water, vegetation,
# obstacle, unknown). Delivered 2026-08-14; supersedes the old binary
# terrain.hef placeholder (kept on disk on the Pi, no longer referenced here).
#
# yolov8n: still the CURRENT placeholder weights already on the Pi
# (models/yolov8n.hef - see CLAUDE.md §10) - the retrained person-detection
# model has not arrived yet. Swap hef_path/score_thr here when it does.
# -----------------------------------------------------------------------------

camera:
  # GUESSED placeholders - NOT a calibrated camera. Every metre-scale number
  # produced by drone_stack/novelty/perception/projector.py (recipient
  # position, displacement rate, zone radii) is only as good as these four
  # values. Calibrate with a standard checkerboard capture before trusting
  # any novelty-layer distance in flight.
  fx: 950.0
  fy: 950.0
  cx: 640.0
  cy: 360.0
  # 0 = nadir (straight down) - the mount this layer's math assumes and the
  # physically correct one for landing-zone/recipient work (drone must see
  # what's below it). IMPORTANT: the existing Pi camera on this airframe was
  # set up for general GCS monitoring, not confirmed nadir - measure the
  # actual mount angle before flight and correct this value; do not assume
  # 0 is accurate for the physical rig as wired today.
  tilt_from_nadir_deg: 0.0

models:
  terrain:
    kind: segmenter
    hef_path: models/fabseg.hef
    # (h, w, c) - GUESSED. This field is DOCUMENTATION only: the real input
    # tensor shape is queried from the .hef itself via HailoRT at load time
    # (drone_stack/gcs/hailo_infer.py's _Model.__init__ -> im.input().shape),
    # never read from here, so a wrong guess cannot break inference - but it
    # should still be corrected to the true value once fabseg.hef is loaded
    # on the Pi's Hailo-8 and the real shape is logged at startup.
    input_shape: [384, 640, 3]
    # No seg_threshold - fabseg.hef is a genuine 7-class model, argmax over
    # channels has no threshold. class_map is the .hef's own output-channel
    # order, index-for-index (confirmed with the model provider 2026-08-14):
    # channel 0 = grass, 1 = pavement, ... matching TerrainClass's own
    # declared enum order exactly, so no separate index<->class table was
    # needed beyond listing it here.
    class_map:
      - grass
      - pavement
      - dirt
      - water
      - vegetation
      - obstacle
      - unknown

  yolov8n:
    kind: detector
    hef_path: models/yolov8n.hef
    input_shape: [640, 640, 3]   # standard yolov8n Hailo export input
    # Deliberately NOT the GCS overlay's threshold (gcs/cameras.py
    # _build_hailo_processors uses 0.40 for the on-screen box only). CLAUDE.md
    # §10 is explicit that both person models peak at only ~0.27-0.37
    # confidence on clear test people on the CURRENT weak/placeholder
    # weights - a 0.40 threshold would filter out every real detection and
    # make the vision channel of §2.2 never succeed. Matches
    # hailo_infer.py's own module-level default (0.25) instead. RAISE this
    # once retrained weights arrive and peak confidence is known to clear a
    # higher bar - see docs/novelty/recipient_auth.md "Known limitations".
    score_thr: 0.25
